name: Guard402 Cloud Gateway 10-Minute Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Ping Gateway /health and /mcp JSON-RPC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_GATEWAY_URL: ${{ secrets.LIVE_GATEWAY_URL }}
    steps:
      - name: Warm Up Gateway Health & MCP JSON-RPC Endpoints
        run: |
          GATEWAY="${LIVE_GATEWAY_URL:-https://guard402-autonomous-engine.onrender.com}"
          GATEWAY="${GATEWAY%/}"
          echo "Pinging ${GATEWAY}/health ..."
          curl -fsSL --retry 3 --retry-delay 5 --max-time 25 "${GATEWAY}/health"
          echo ""
          echo "Sending JSON-RPC 2.0 ping to ${GATEWAY}/mcp ..."
          curl -fsSL --retry 2 --retry-delay 3 --max-time 25 \
            -X POST "${GATEWAY}/mcp" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}'
          echo ""
          echo "Sending JSON-RPC 2.0 tools/list to ${GATEWAY}/mcp ..."
          curl -fsSL --retry 2 --retry-delay 3 --max-time 25 \
            -X POST "${GATEWAY}/mcp" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          echo ""
